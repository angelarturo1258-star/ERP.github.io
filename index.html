<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Para ti</title>

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

</head>


<body>

    <!-- =========================================
         fondo 00
    ========================================== -->

    <div class="fondo-inicio">

        <!-- Los destellos serán creados por JS -->

        <div
            class="contenedor-destellos"
            id="contenedorDestellos"
        ></div>

    </div>



    <main class="pantalla-inicio">


        <!-- =====================================
             TEXTO
        ====================================== -->

        <div class="contenedor-texto">

            <p class="texto-principal">
                ¡Mucho gusto!, soy Ángel, tu compañero.
            </p>


            <p
                class="texto-invitacion"
                id="textoInvitacion"
            >
                Toca la imagen.
            </p>

        </div>


        <!-- =====================================
             BOTÓN DE IMAGEN
        ====================================== -->

        <button
            class="boton-imagen"
            id="botonImagen"
            type="button"
            aria-label="Abrir carta"
        >

            <img
                class="imagen-central"
                src="/Imagenes/Boton.jpg"
                alt="Abrir carta"
            >

        </button>


    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="/JS/script.js"></script>

</body>

</html>
